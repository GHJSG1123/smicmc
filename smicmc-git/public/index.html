<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>校园瓜田</title>
<meta name="description" content="校园新闻、传言、八卦与爆料。每条瓜都标注可信度，传言不冒充事实。" />
<meta name="theme-color" content="#0b0b0e" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍉</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-mark">🍉</span>
    <span class="brand-name">校园瓜田</span>
  </a>

  <div class="search-wrap">
    <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="global-search" class="search-input" placeholder="搜瓜、搜标签..." autocomplete="off" />
  </div>

  <div class="topbar-right">
    <button class="link-btn" id="btn-login">登录</button>
    <button class="btn btn-outline btn-sm" id="btn-register">注册</button>
    <a class="btn btn-primary btn-sm" href="#/new">+ 发布</a>
  </div>
</header>

<div id="net-banner" class="net-banner hidden"></div>

<div class="layout">

  <aside class="sidenav">
    <a href="#/" data-nav="feed"><span class="nav-ico">🏠</span>首页</a>
    <a href="#/hot" data-nav="hot"><span class="nav-ico">🔥</span>热榜</a>
    <a href="#/new" data-nav="new"><span class="nav-ico">✍️</span>发布</a>
    <a href="#/me" data-nav="me"><span class="nav-ico">👤</span>我的</a>
  </aside>

  <main id="app" class="app">
    <div class="skeleton-list">
      <div class="sk-card"><div class="sk-line w40"></div><div class="sk-line w80"></div><div class="sk-line w60"></div></div>
      <div class="sk-card"><div class="sk-line w30"></div><div class="sk-line w70"></div><div class="sk-line w50"></div></div>
    </div>
  </main>

  <aside class="rail">
    <section class="rail-card">
      <h4>🔥 热瓜榜</h4>
      <div id="rail-hot" class="rail-body"><div class="rail-empty">还没有热瓜</div></div>
    </section>
    <section class="rail-card">
      <h4>🏷 热门标签</h4>
      <div id="rail-tags" class="rail-body"><div class="rail-empty">还没有标签</div></div>
    </section>
    <section class="rail-card rail-about">
      <h4>关于</h4>
      <p>每条瓜都标注可信度：已证实 / 待核实 / 传言 / 已辟谣。<br>传言不冒充事实。</p>
    </section>
  </aside>

</div>

<nav class="tabbar">
  <a href="#/" data-tab="feed"><span>🏠</span><em>首页</em></a>
  <a href="#/hot" data-tab="hot"><span>🔥</span><em>热榜</em></a>
  <a href="#/new" data-tab="new"><span>✏️</span><em>发布</em></a>
  <a href="#/me" data-tab="me"><span>👤</span><em>我的</em></a>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card" id="modal-card"></div>
</div>

<footer class="site-foot">
  本站内容为用户发布，不代表本站立场。<br>
  请勿发布他人隐私或未经证实的信息。
</footer>

<script src="app.js"></script>
</body>
</html>
